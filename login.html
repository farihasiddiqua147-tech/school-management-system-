<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>লগইন | School Manager</title><meta name="theme-color" content="#0f766e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/app-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="src/styles.css"></head>
<body><main style="max-width:460px;margin:8vh auto;padding:24px"><section class="panel"><h1>স্কুল ম্যানেজমেন্ট লগইন</h1><p>অ্যাডমিন, শিক্ষক অথবা শিক্ষার্থী অ্যাকাউন্ট দিয়ে প্রবেশ করুন।</p><form id="loginForm" class="form-grid"><label>ইমেইল<input name="email" type="email" required autocomplete="username" placeholder="admin@example.com"></label><label>পাসওয়ার্ড<input name="password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">লগইন</button><p id="message" role="status"></p></form><p><small>সার্ভার চালু না থাকলে বা API ঠিকানা সেট না করলে লগইন কাজ করবে না।</small></p></section></main><script src="src/pwa.js"></script><script src="src/login.js"></script></body></html>
